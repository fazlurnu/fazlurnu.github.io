<div class="py-widget">
  <div class="py-widget-header">
    <span class="py-widget-lang">Python · Interactive</span>
    <span class="py-widget-status" id="cd-status">Loading runtime…</span>
  </div>

  <div class="py-widget-controls">
    <div class="cd-slider-label">Position noise distribution</div>
    <div class="cd-dropdown-row">
      <select id="cd-dist" disabled>
        <option value="0">Gaussian</option>
        <option value="1">Mixture of 2 Gaussians — one dominant</option>
        <option value="2">Mixture of 3 Gaussians — equal weight</option>
        <option value="3">Uniform square</option>
      </select>
    </div>
    <div class="cd-slider-label" style="margin-top:6px;">Intruder</div>
    <div class="py-slider-row">
      <label for="cd-speed">Speed (kts)</label>
      <input type="range" id="cd-speed" min="50" max="150" step="5" value="90" disabled>
      <output id="cd-speed-val">90</output>
    </div>
    <div class="py-slider-row">
      <label for="cd-hdg">Heading (°)</label>
      <input type="range" id="cd-hdg" min="0" max="355" step="5" value="315" disabled>
      <output id="cd-hdg-val">315</output>
    </div>
  </div>

  <div class="py-btn-row">
    <button class="py-widget-btn" id="cd-add1"    disabled>Add 1 Sample</button>
    <button class="py-widget-btn" id="cd-add10"   disabled>Add 10 Samples</button>
    <button class="py-widget-btn" id="cd-add100"  disabled>Add 100 Samples</button>
    <button class="py-widget-btn" id="cd-add1000" disabled>Add 1000 Samples</button>
    <button class="py-widget-btn py-widget-btn-danger" id="cd-reset" disabled>Reset</button>
    <span class="cd-count" id="cd-count">0 samples</span>
  </div>

  <div class="py-widget-plot" style="flex-direction:column;align-items:stretch;">
    <pre id="cd-error" style="display:none;margin:0 0 12px;padding:10px 12px;background:#fff3f3;border:1px solid tomato;border-radius:6px;font-size:11px;color:#c00;white-space:pre-wrap;overflow-x:auto;"></pre>
    <div id="cd-loading">
      <div class="py-spinner"></div>
      <span>Loading Python (~10 s on first visit, cached after)</span>
    </div>
    <img id="cd-img" alt="Conflict detection plot" style="display:none;width:100%;border-radius:8px;">
  </div>
</div>

<script type="module">
import { loadPyodide } from "https://cdn.jsdelivr.net/pyodide/v0.27.0/full/pyodide.mjs";

const statusEl  = document.getElementById("cd-status");
const loadingEl = document.getElementById("cd-loading");
const imgEl     = document.getElementById("cd-img");
const countEl   = document.getElementById("cd-count");
const errorEl   = document.getElementById("cd-error");

const btn1    = document.getElementById("cd-add1");
const btn10   = document.getElementById("cd-add10");
const btn100  = document.getElementById("cd-add100");
const btn1000 = document.getElementById("cd-add1000");
const btnReset = document.getElementById("cd-reset");

const speedSlider = document.getElementById("cd-speed");
const hdgSlider   = document.getElementById("cd-hdg");
const speedOut    = document.getElementById("cd-speed-val");
const hdgOut      = document.getElementById("cd-hdg-val");
const distSelect  = document.getElementById("cd-dist");

const allBtns    = [btn1, btn10, btn100, btn1000, btnReset];
const allSliders = [speedSlider, hdgSlider];
const allControls = [...allBtns, ...allSliders, distSelect];

const pyodide = await loadPyodide();
await pyodide.loadPackage(["numpy", "matplotlib"]);

await pyodide.runPythonAsync(`
import matplotlib
matplotlib.use("Agg")
import matplotlib.pyplot as plt
import numpy as np, io, base64, math

# ── Fixed parameters ──────────────────────────────────────────────────────────
V_OWN      = np.array([0.0, 100.0])    # ownship: 100 kts north
X_REL_MEAN = np.array([35.0, 18.0])    # intruder mean rel. position (NM)
SIGMA      = 2.0                        # position std (NM)
ARROW_SCALE = 0.12                      # NM per kt for velocity arrows

# ── Mutable scenario (updated by sliders) ────────────────────────────────────
V_INT      = None
V_REL      = None
T_CPA_TRUE = None
DCPA_TRUE  = None
DCPA_MAG   = None

GEO_XLIM  = GEO_YLIM  = None
XREL_XLIM = XREL_YLIM = None
DCPA_XLIM = DCPA_YLIM = None
HIST_XLIM = None
HIST_YLIM = (0.0, 0.5)   # fixed: conservative upper bound for folded-normal density

def update_scenario(speed_kts, heading_deg):
    global V_INT, V_REL, T_CPA_TRUE, DCPA_TRUE, DCPA_MAG
    hdg = math.radians(float(heading_deg))
    V_INT = np.array([float(speed_kts) * math.sin(hdg),
                      float(speed_kts) * math.cos(hdg)])
    V_REL = V_OWN - V_INT
    dv2 = float(np.dot(V_REL, V_REL))
    T_CPA_TRUE = float(np.dot(V_REL, X_REL_MEAN)) / dv2 if dv2 > 1e-9 else 0.0
    DCPA_TRUE  = X_REL_MEAN - V_REL * T_CPA_TRUE
    DCPA_MAG   = float(np.linalg.norm(DCPA_TRUE))
    _recompute_limits()

def _recompute_limits():
    global GEO_XLIM, GEO_YLIM, XREL_XLIM, XREL_YLIM, DCPA_XLIM, DCPA_YLIM, HIST_XLIM
    vr_norm = np.linalg.norm(V_REL) + 1e-9
    _v_hat  = V_REL / vr_norm
    _perp   = np.array([-_v_hat[1], _v_hat[0]])
    _scatter = 4.0 * SIGMA

    t_end     = max(T_CPA_TRUE * 1.5, 0.01)
    _cpa_foot = V_REL * T_CPA_TRUE
    _vrel_end = V_REL * t_end
    _own_vo   = V_OWN * ARROW_SCALE
    _own_vi   = -V_INT * ARROW_SCALE

    _geo_pts = np.vstack([
        [0, 0], X_REL_MEAN, _cpa_foot, _vrel_end,
        _own_vo, _own_vi, X_REL_MEAN + V_INT * ARROW_SCALE
    ])
    _geo_cx   = (_geo_pts[:,0].min() + _geo_pts[:,0].max()) / 2
    _geo_cy   = (_geo_pts[:,1].min() + _geo_pts[:,1].max()) / 2
    _geo_half = max(
        _geo_pts[:,0].max() - _geo_cx, _geo_cx - _geo_pts[:,0].min(),
        _geo_pts[:,1].max() - _geo_cy, _geo_cy - _geo_pts[:,1].min()
    ) + 7.0
    GEO_XLIM = (_geo_cx - _geo_half, _geo_cx + _geo_half)
    GEO_YLIM = (_geo_cy - _geo_half, _geo_cy + _geo_half)

    # Extra margin to fit mix2/mix3 component offsets (max ~6.5 NM from mean)
    _xr_half  = _scatter + 8.0
    XREL_XLIM = (X_REL_MEAN[0] - _xr_half, X_REL_MEAN[0] + _xr_half)
    XREL_YLIM = (X_REL_MEAN[1] - _xr_half, X_REL_MEAN[1] + _xr_half)

    _dc_half  = float(np.max(np.abs(_perp)) * (_scatter + 8.0)) + 3.0
    DCPA_XLIM = (float(DCPA_TRUE[0]) - _dc_half, float(DCPA_TRUE[0]) + _dc_half)
    DCPA_YLIM = (float(DCPA_TRUE[1]) - _dc_half, float(DCPA_TRUE[1]) + _dc_half)

    HIST_XLIM = (0.0, max(DCPA_MAG + 5.0 * SIGMA, 2.0))

update_scenario(90.0, 315.0)

# ── Distribution type ─────────────────────────────────────────────────────────
DIST_TYPE = 0   # 0=Gaussian  1=Mix2  2=Mix3  3=Uniform-square

# Component definitions (offsets and sigmas relative to X_REL_MEAN / SIGMA)
_MIX2_COMPS  = [(0.75, np.array([0.0, 0.0]),   1.0),   # dominant
                (0.25, np.array([6.0, 0.0]),    0.8)]   # secondary (6 NM east)

_MIX3_OFFSETS = [np.array([-4.5, 2.5]),   # NW of mean
                 np.array([ 4.5, 2.5]),   # NE of mean
                 np.array([ 0.0,-4.5])]   # south of mean
_MIX3_SIGMA  = 0.7                        # scale factor × SIGMA

def set_dist_type(t):
    global DIST_TYPE
    DIST_TYPE = int(t)

def _sample_xrel(n):
    k = int(n)
    if DIST_TYPE == 0:
        return np.random.multivariate_normal(X_REL_MEAN, SIGMA**2 * np.eye(2), k)

    elif DIST_TYPE == 1:
        out = np.empty((k, 2))
        u   = np.random.random(k)
        for (w, off, sig), u_lo, u_hi in zip(
                _MIX2_COMPS,
                [0.0, _MIX2_COMPS[0][0]],
                [_MIX2_COMPS[0][0], 1.0]):
            idx = np.where((u >= u_lo) & (u < u_hi))[0]
            if len(idx):
                out[idx] = np.random.multivariate_normal(
                    X_REL_MEAN + off, (sig*SIGMA)**2 * np.eye(2), len(idx))
        return out

    elif DIST_TYPE == 2:
        out  = np.empty((k, 2))
        comp = np.random.randint(0, 3, k)
        for i, off in enumerate(_MIX3_OFFSETS):
            idx = np.where(comp == i)[0]
            if len(idx):
                out[idx] = np.random.multivariate_normal(
                    X_REL_MEAN + off, (_MIX3_SIGMA*SIGMA)**2 * np.eye(2), len(idx))
        return out

    else:   # Uniform square: half-range = SIGMA*sqrt(3) → same variance as Gaussian
        half = SIGMA * math.sqrt(3)
        return np.column_stack([
            np.random.uniform(X_REL_MEAN[0]-half, X_REL_MEAN[0]+half, k),
            np.random.uniform(X_REL_MEAN[1]-half, X_REL_MEAN[1]+half, k),
        ])

# ── Sample storage ────────────────────────────────────────────────────────────
xrel_samples = []
dcpa_samples = []
dcpa_mags    = []

def add_samples(n=1):
    draws = _sample_xrel(int(n))
    for xr in draws:
        t  = float(np.dot(V_REL, xr) / np.dot(V_REL, V_REL))
        dc = xr - V_REL * t
        xrel_samples.append(xr.tolist())
        dcpa_samples.append(dc.tolist())
        dcpa_mags.append(float(np.linalg.norm(dc)))

def reset_samples():
    xrel_samples.clear()
    dcpa_samples.clear()
    dcpa_mags.clear()

# ── Render ────────────────────────────────────────────────────────────────────
def render():
    import traceback as _tb
    try:
        return _render_inner()
    except Exception:
        return "ERR:" + _tb.format_exc()

def _render_inner():
    C1, C2, C3, C4 = "#1a73e8", "tomato", "#34a853", "#f9a825"
    CGRAY = "#888888"

    xs = np.array(xrel_samples) if xrel_samples else None
    ds = np.array(dcpa_samples) if dcpa_samples else None
    ms = np.array(dcpa_mags)    if dcpa_mags    else None
    n  = len(xrel_samples)

    fig, axes = plt.subplots(2, 2, figsize=(11, 9))
    fig.patch.set_facecolor("white")

    # ── (0,0) Conflict geometry ───────────────────────────────────────────────
    ax = axes[0, 0]
    vr_hat    = V_REL / (np.linalg.norm(V_REL) + 1e-9)
    cpa_foot  = V_REL * T_CPA_TRUE   # foot of perpendicular on V_rel line

    # Extended V_rel trajectory line from ownship (dashed green)
    t_end = max(T_CPA_TRUE * 1.5, 0.01)
    ax.plot([0, V_REL[0]*t_end], [0, V_REL[1]*t_end],
            "--", color=C3, lw=1.3, alpha=0.55, zorder=2)

    # x_rel: ownship → intruder (dashed gray)
    ax.plot([0, X_REL_MEAN[0]], [0, X_REL_MEAN[1]],
            "--", color=CGRAY, lw=1.1, alpha=0.55, zorder=2)
    _mid = X_REL_MEAN * 0.45
    ax.text(_mid[0] - 1.5, _mid[1] + 1.0, "x_rel", color=CGRAY, fontsize=8.5)

    # dCPA perpendicular: cpa_foot → intruder
    ax.plot([cpa_foot[0], X_REL_MEAN[0]], [cpa_foot[1], X_REL_MEAN[1]],
            "-", color=C3, lw=2.0, zorder=4,
            label=f"d_CPA = {DCPA_MAG:.2f} NM")
    ax.scatter(*cpa_foot, color=C3, s=55, zorder=5)
    # Right-angle marker at cpa_foot
    _dn = float(np.linalg.norm(DCPA_TRUE))
    if _dn > 1e-6:
        _dd  = DCPA_TRUE / _dn
        _sq  = (GEO_XLIM[1] - GEO_XLIM[0]) * 0.024
        _p1  = cpa_foot + _sq * _dd
        _p2  = cpa_foot + _sq * vr_hat
        _p3  = _p1 + _sq * vr_hat
        ax.plot([_p1[0], _p3[0], _p2[0]], [_p1[1], _p3[1], _p2[1]],
                "-", color=C3, lw=0.9, zorder=5)

    # ── Velocity arrows at ownship ──
    # V_own (blue, north)
    vow = V_OWN * ARROW_SCALE
    ax.annotate("", xy=vow, xytext=(0,0),
                arrowprops=dict(arrowstyle="-|>", color=C1, lw=1.8, mutation_scale=14))
    ax.text(vow[0] + 0.6, vow[1] - 0.5, "Vo", color=C1, fontsize=9, fontweight="bold")

    # -V_int (gray, vector-sum construction)
    nvi = -V_INT * ARROW_SCALE
    ax.annotate("", xy=nvi, xytext=(0,0),
                arrowprops=dict(arrowstyle="-|>", color=CGRAY, lw=1.4, mutation_scale=12))
    ax.text(nvi[0] + 0.4, nvi[1] - 0.8, "-Vi", color=CGRAY, fontsize=9)

    # V_rel (green)
    vrl = V_REL * ARROW_SCALE
    ax.annotate("", xy=vrl, xytext=(0,0),
                arrowprops=dict(arrowstyle="-|>", color=C3, lw=2.0, mutation_scale=14))
    ax.text(vrl[0] + 0.5, vrl[1] - 0.8, "Vrel", color=C3, fontsize=9, fontweight="bold")

    # Ownship dot (on top)
    ax.scatter(0, 0, color=C1, s=120, zorder=7, label="Ownship")

    # ── Intruder ──
    vi  = V_INT * ARROW_SCALE
    vit = X_REL_MEAN + vi
    ax.annotate("", xy=vit, xytext=X_REL_MEAN,
                arrowprops=dict(arrowstyle="-|>", color=C2, lw=1.8, mutation_scale=14))
    ax.text(vit[0] - 0.5, vit[1] + 0.5, "Vi", color=C2, fontsize=9, fontweight="bold")
    ax.scatter(*X_REL_MEAN, color=C2, s=120, marker="^", zorder=7, label="Intruder")

    ax.set_xlim(*GEO_XLIM)
    ax.set_ylim(*GEO_YLIM)
    ax.set_xlabel("x (NM)", fontsize=10)
    ax.set_ylabel("y (NM)", fontsize=10)
    ax.set_title("Conflict geometry", fontsize=11, fontweight="bold")
    ax.legend(fontsize=9, loc="upper left")
    ax.set_aspect("equal")
    ax.grid(True, alpha=0.25)

    # ── (0,1) Relative position samples ──────────────────────────────────────
    ax = axes[0, 1]
    th = np.linspace(0, 2*np.pi, 200)
    if xs is not None:
        ax.scatter(xs[:,0], xs[:,1], color=C4, s=28, alpha=0.60, zorder=3,
                   label=f"Samples (n={n})")
    # Distribution overlay
    if DIST_TYPE == 0:
        ax.plot(X_REL_MEAN[0] + SIGMA*np.cos(th),
                X_REL_MEAN[1] + SIGMA*np.sin(th),
                "--", color=C2, lw=1.2, alpha=0.6, label="1-\u03c3 bound")
        ax.scatter(*X_REL_MEAN, color=C2, s=120, marker="*", zorder=6, label="Mean")
    elif DIST_TYPE == 1:
        for w, off, sig in _MIX2_COMPS:
            mu = X_REL_MEAN + off
            lw = 1.6 if w > 0.5 else 1.0
            ls = "-" if w > 0.5 else "--"
            ax.plot(mu[0] + sig*SIGMA*np.cos(th), mu[1] + sig*SIGMA*np.sin(th),
                    ls, color=C2, lw=lw, alpha=0.65)
            ax.scatter(*mu, color=C2, s=80, marker="*", zorder=6)
        ax.scatter([], [], color=C2, s=80, marker="*", label="Component means")
    elif DIST_TYPE == 2:
        for i, off in enumerate(_MIX3_OFFSETS):
            mu = X_REL_MEAN + off
            ax.plot(mu[0] + _MIX3_SIGMA*SIGMA*np.cos(th),
                    mu[1] + _MIX3_SIGMA*SIGMA*np.sin(th),
                    "--", color=C2, lw=1.1, alpha=0.65)
            ax.scatter(*mu, color=C2, s=80, marker="*", zorder=6)
        ax.scatter([], [], color=C2, s=80, marker="*", label="Component means")
    else:   # Uniform square
        half = SIGMA * math.sqrt(3)
        sq_x = [X_REL_MEAN[0]-half, X_REL_MEAN[0]+half,
                X_REL_MEAN[0]+half, X_REL_MEAN[0]-half, X_REL_MEAN[0]-half]
        sq_y = [X_REL_MEAN[1]-half, X_REL_MEAN[1]-half,
                X_REL_MEAN[1]+half, X_REL_MEAN[1]+half, X_REL_MEAN[1]-half]
        ax.plot(sq_x, sq_y, "--", color=C2, lw=1.2, alpha=0.65, label="Uniform bounds")
        ax.scatter(*X_REL_MEAN, color=C2, s=120, marker="*", zorder=6, label="Center")
    ax.set_xlim(*XREL_XLIM)
    ax.set_ylim(*XREL_YLIM)
    ax.set_xlabel("x_rel,x (NM)", fontsize=10)
    ax.set_ylabel("x_rel,y (NM)", fontsize=10)
    ax.set_title("Relative position samples", fontsize=11, fontweight="bold")
    ax.legend(fontsize=9)
    ax.set_aspect("equal")
    ax.grid(True, alpha=0.25)

    # ── (1,0) d_CPA vector ────────────────────────────────────────────────────
    ax = axes[1, 0]
    if ds is not None:
        ax.scatter(ds[:,0], ds[:,1], color=C4, s=28, alpha=0.65, zorder=3,
                   label="d_CPA samples")
    ax.scatter(*DCPA_TRUE, color=C3, s=120, marker="*", zorder=6,
               label=f"True d_CPA ({DCPA_TRUE[0]:.1f}, {DCPA_TRUE[1]:.1f}) NM")
    ax.axhline(0, color="gray", lw=0.6, alpha=0.4)
    ax.axvline(0, color="gray", lw=0.6, alpha=0.4)
    ax.set_xlim(*DCPA_XLIM)
    ax.set_ylim(*DCPA_YLIM)
    ax.set_xlabel("d_CPA,x (NM)", fontsize=10)
    ax.set_ylabel("d_CPA,y (NM)", fontsize=10)
    ax.set_title("d_CPA vector", fontsize=11, fontweight="bold")
    ax.legend(fontsize=9)
    ax.set_aspect("equal")
    ax.grid(True, alpha=0.25)

    # ── (1,1) Histogram of |d_CPA| ───────────────────────────────────────────
    ax = axes[1, 1]
    if ms is not None and len(ms) >= 2:
        ax.hist(ms, bins="auto", color=C4, alpha=0.72, edgecolor="white",
                density=True, label="|d_CPA| samples")
    ax.axvline(DCPA_MAG, color=C3, linestyle="--", lw=2.0,
               label=f"True |d_CPA| = {DCPA_MAG:.2f} NM")
    ax.set_xlim(*HIST_XLIM)
    ax.set_ylim(*HIST_YLIM)
    ax.set_xlabel("|d_CPA| (NM)", fontsize=10)
    ax.set_ylabel("Density", fontsize=10)
    ax.set_title("Distribution of |d_CPA|", fontsize=11, fontweight="bold")
    ax.legend(fontsize=9)
    ax.grid(True, alpha=0.25)

    plt.tight_layout()
    buf = io.BytesIO()
    fig.savefig(buf, format="png", dpi=130, bbox_inches="tight", facecolor="white")
    plt.close(fig)
    buf.seek(0)
    return base64.b64encode(buf.read()).decode()
`);

// ── Unlock all controls ──────────────────────────────────────────────────────
statusEl.textContent = "Ready";
loadingEl.style.display = "none";
imgEl.style.display = "block";
allControls.forEach(el => el.disabled = false);

// ── Helpers ──────────────────────────────────────────────────────────────────
function lock()   { allControls.forEach(el => el.disabled = true);  }
function unlock() { allControls.forEach(el => el.disabled = false); }

async function refresh() {
  imgEl.style.opacity = "0.5";
  try {
    const result = await pyodide.runPythonAsync("render()");
    if (result.startsWith("ERR:")) {
      statusEl.textContent = "Python error";
      errorEl.textContent  = result.slice(4);
      errorEl.style.display = "block";
      console.error("[cd-widget]", result.slice(4));
    } else {
      errorEl.style.display = "none";
      imgEl.src = "data:image/png;base64," + result;
      statusEl.textContent = "Ready";
    }
  } catch (e) {
    statusEl.textContent = "JS error: " + e.message;
    console.error("[cd-widget]", e);
  }
  imgEl.style.opacity = "1";
}

async function syncCount() {
  const n = await pyodide.runPythonAsync("len(xrel_samples)");
  countEl.textContent = n === 1 ? "1 sample" : `${n} samples`;
}

async function addSamples(n) {
  lock();
  await pyodide.runPythonAsync(`add_samples(${n})`);
  await syncCount();
  await refresh();
  unlock();
}

await refresh();

// ── Sample buttons ───────────────────────────────────────────────────────────
btn1   .addEventListener("click", () => addSamples(1));
btn10  .addEventListener("click", () => addSamples(10));
btn100 .addEventListener("click", () => addSamples(100));
btn1000.addEventListener("click", () => addSamples(1000));

btnReset.addEventListener("click", async () => {
  lock();
  await pyodide.runPythonAsync("reset_samples()");
  await syncCount();
  await refresh();
  unlock();
});

// ── Sliders (debounced; resets samples on change) ────────────────────────────
let sliderTimer;
async function onSliderChange() {
  const spd = speedSlider.value;
  const hdg = hdgSlider.value;
  speedOut.value = spd;
  hdgOut.value   = hdg;
  clearTimeout(sliderTimer);
  sliderTimer = setTimeout(async () => {
    lock();
    await pyodide.runPythonAsync(`update_scenario(${spd}, ${hdg})`);
    await pyodide.runPythonAsync("reset_samples()");
    await syncCount();
    await refresh();
    unlock();
  }, 300);
}

speedSlider.addEventListener("input", onSliderChange);
hdgSlider  .addEventListener("input", onSliderChange);

distSelect.addEventListener("change", async () => {
  lock();
  await pyodide.runPythonAsync(`set_dist_type(${distSelect.value})`);
  await pyodide.runPythonAsync("reset_samples()");
  await syncCount();
  await refresh();
  unlock();
});
</script>
