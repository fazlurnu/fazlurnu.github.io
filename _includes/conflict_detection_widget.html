<div class="py-widget">
  <div class="py-widget-header">
    <span class="py-widget-lang">Python · Interactive</span>
    <span class="py-widget-status" id="cd-status">Loading runtime…</span>
  </div>

  <div class="py-btn-row">
    <button class="py-widget-btn" id="cd-add1"  disabled>Add 10 Samples</button>
    <button class="py-widget-btn" id="cd-add10" disabled>Add 100 Samples</button>
    <button class="py-widget-btn py-widget-btn-danger" id="cd-reset" disabled>Reset</button>
    <span class="cd-count" id="cd-count">0 samples</span>
  </div>

  <div class="py-widget-plot" style="flex-direction:column;align-items:stretch;">
    <pre id="cd-error" style="display:none;margin:0 0 12px;padding:10px 12px;background:#fff3f3;border:1px solid tomato;border-radius:6px;font-size:11px;color:#c00;white-space:pre-wrap;overflow-x:auto;"></pre>
    <div id="cd-loading">
      <div class="py-spinner"></div>
      <span>Loading Python (~10 s on first visit, cached after)</span>
    </div>
    <img id="cd-img" alt="Conflict detection plot" style="display:none;width:100%;border-radius:8px;">
  </div>
</div>

<style>
/* ── Base widget chrome ── */
.py-widget {
  border: 1px solid var(--line);
  border-radius: var(--radius);
  overflow: hidden;
  margin: 2rem 0;
}
.py-widget-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 8px 16px;
  background: var(--accent-soft);
  border-bottom: 1px solid var(--line);
  font-size: 12px;
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
.py-widget-lang   { color: var(--accent); font-weight: 600; }
.py-widget-status { color: var(--muted); }
.py-widget-plot {
  padding: 16px;
  min-height: 72px;
  display: flex;
  align-items: center;
  justify-content: center;
}
#cd-loading {
  display: flex;
  align-items: center;
  gap: 10px;
  color: var(--muted);
  font-size: 13px;
  font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
}
.py-spinner {
  flex-shrink: 0;
  width: 16px;
  height: 16px;
  border: 2px solid var(--line-strong);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: py-spin 0.75s linear infinite;
}
@keyframes py-spin { to { transform: rotate(360deg); } }

/* ── Button row ── */
.py-btn-row {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 10px 16px;
  border-bottom: 1px solid var(--line);
  flex-wrap: wrap;
}
.py-widget-btn {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 12px;
  font-weight: 600;
  padding: 5px 14px;
  border-radius: 6px;
  border: 1.5px solid var(--accent);
  background: transparent;
  color: var(--accent);
  cursor: pointer;
  transition: background 0.15s, color 0.15s;
  line-height: 1.4;
}
.py-widget-btn:hover:not(:disabled) {
  background: var(--accent);
  color: #fff;
}
.py-widget-btn:disabled {
  border-color: var(--line);
  color: var(--muted);
  cursor: not-allowed;
}
.py-widget-btn-danger {
  border-color: tomato;
  color: tomato;
}
.py-widget-btn-danger:hover:not(:disabled) {
  background: tomato;
  color: #fff;
}
.py-widget-btn-danger:disabled {
  border-color: var(--line);
  color: var(--muted);
}
.cd-count {
  margin-left: auto;
  font-size: 12px;
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  color: var(--muted);
}
</style>

<script type="module">
import { loadPyodide } from "https://cdn.jsdelivr.net/pyodide/v0.27.0/full/pyodide.mjs";

const statusEl  = document.getElementById("cd-status");
const loadingEl = document.getElementById("cd-loading");
const imgEl     = document.getElementById("cd-img");
const countEl   = document.getElementById("cd-count");
const btn1      = document.getElementById("cd-add1");
const btn10     = document.getElementById("cd-add10");
const btnReset  = document.getElementById("cd-reset");

const pyodide = await loadPyodide();
await pyodide.loadPackage(["numpy", "matplotlib"]);

await pyodide.runPythonAsync(`
import matplotlib
matplotlib.use("Agg")
import matplotlib.pyplot as plt
import numpy as np, io, base64

# ── Scenario ────────────────────────────────────────────────────────────────
# All positions in NM, velocities in kts
# Ownship: 100 kts north;  Intruder: 90 kts northwest (hdg 315 deg)
V_OWN = np.array([0.0, 100.0])
V_INT = np.array([-90.0 / np.sqrt(2), 90.0 / np.sqrt(2)])
V_REL = V_OWN - V_INT           # relative velocity (kts)

# Mean relative position: intruder 30 NM east, 21 NM north of ownship
X_REL_MEAN = np.array([30.0, 21.0])
SIGMA       = 2.0                # isotropic position std (NM)

# Arrow display scale for geometry plot (NM per kt)
ARROW_SCALE = 0.08

def _dcpa(x_rel):
    t = np.dot(V_REL, x_rel) / np.dot(V_REL, V_REL)
    return x_rel - V_REL * t, t

T_CPA_TRUE = float(np.dot(V_REL, X_REL_MEAN) / np.dot(V_REL, V_REL))
DCPA_TRUE  = _dcpa(X_REL_MEAN)[0]
DCPA_MAG   = float(np.linalg.norm(DCPA_TRUE))

# ── Pre-computed fixed axis limits ───────────────────────────────────────────
_v_hat   = V_REL / np.linalg.norm(V_REL)
_perp    = np.array([-_v_hat[1], _v_hat[0]])   # unit perp to V_rel
_scatter = 4.0 * SIGMA                          # 4-sigma coverage

# Geometry: square bounding box around (ownship, intruder, dCPA) + padding
_geo_pts  = np.array([[0,0], X_REL_MEAN, DCPA_TRUE])
_geo_cx   = (_geo_pts[:,0].min() + _geo_pts[:,0].max()) / 2
_geo_cy   = (_geo_pts[:,1].min() + _geo_pts[:,1].max()) / 2
_geo_half = max(_geo_pts[:,0].max()-_geo_cx, _geo_cx-_geo_pts[:,0].min(),
                _geo_pts[:,1].max()-_geo_cy, _geo_cy-_geo_pts[:,1].min()) + 6.0
GEO_XLIM  = (_geo_cx - _geo_half, _geo_cx + _geo_half)
GEO_YLIM  = (_geo_cy - _geo_half, _geo_cy + _geo_half)

# Relative position: square centred on mean, ±4σ + margin
_xr_half  = _scatter + 2.0
XREL_XLIM = (X_REL_MEAN[0] - _xr_half, X_REL_MEAN[0] + _xr_half)
XREL_YLIM = (X_REL_MEAN[1] - _xr_half, X_REL_MEAN[1] + _xr_half)

# dCPA: square centred on true dCPA; spread determined by perp direction
_dc_half  = float(np.max(np.abs(_perp)) * _scatter) + 2.0
DCPA_XLIM = (float(DCPA_TRUE[0]) - _dc_half, float(DCPA_TRUE[0]) + _dc_half)
DCPA_YLIM = (float(DCPA_TRUE[1]) - _dc_half, float(DCPA_TRUE[1]) + _dc_half)

# Histogram
HIST_XLIM = (0.0, DCPA_MAG + 5.0 * SIGMA)

xrel_samples = []
dcpa_samples = []
dcpa_mags    = []

def add_samples(n=1):
    draws = np.random.multivariate_normal(X_REL_MEAN, SIGMA**2 * np.eye(2), n)
    for xr in draws:
        dc, _ = _dcpa(xr)
        xrel_samples.append(xr.tolist())
        dcpa_samples.append(dc.tolist())
        dcpa_mags.append(float(np.linalg.norm(dc)))
    return len(xrel_samples)

def reset_samples():
    xrel_samples.clear()
    dcpa_samples.clear()
    dcpa_mags.clear()

def render():
    import traceback as _tb
    try:
        return _render_inner()
    except Exception:
        return "ERR:" + _tb.format_exc()

def _render_inner():
    C1, C2, C3, C4 = "#1a73e8", "tomato", "#34a853", "#f9a825"

    xs = np.array(xrel_samples) if xrel_samples else None
    ds = np.array(dcpa_samples) if dcpa_samples else None
    ms = np.array(dcpa_mags)    if dcpa_mags    else None
    n  = len(xrel_samples)

    fig, axes = plt.subplots(2, 2, figsize=(11, 9))
    fig.patch.set_facecolor("white")

    # ── (0,0) Conflict geometry ───────────────────────────────────────────────
    ax = axes[0, 0]
    # Ownship at origin with V_own arrow (north)
    ax.scatter(0, 0, color=C1, s=110, zorder=6, label="Ownship")
    v_own_tip = np.array([0.0, 0.0]) + V_OWN * ARROW_SCALE
    ax.annotate("", xy=v_own_tip, xytext=(0, 0),
                arrowprops=dict(arrowstyle="-|>", color=C1, lw=1.8, mutation_scale=14))
    ax.text(v_own_tip[0] + 0.4, v_own_tip[1], "Vown", color=C1, fontsize=9)
    # Intruder at X_REL_MEAN with V_int arrow (northwest)
    ax.scatter(*X_REL_MEAN, color=C2, s=110, marker="^", zorder=6, label="Intruder")
    v_int_tip = X_REL_MEAN + V_INT * ARROW_SCALE
    ax.annotate("", xy=v_int_tip, xytext=X_REL_MEAN,
                arrowprops=dict(arrowstyle="-|>", color=C2, lw=1.8, mutation_scale=14))
    ax.text(v_int_tip[0] - 3.0, v_int_tip[1] + 0.3, "Vint", color=C2, fontsize=9)
    # V_rel arrow from X_REL_MEAN
    v_rel_tip = X_REL_MEAN + V_REL * ARROW_SCALE
    ax.annotate("", xy=v_rel_tip, xytext=X_REL_MEAN,
                arrowprops=dict(arrowstyle="-|>", color=C3, lw=2.0, mutation_scale=14))
    ax.text(v_rel_tip[0] + 0.4, v_rel_tip[1] - 0.8, "Vrel", color=C3, fontsize=9)
    # Trajectory: relative position over time x_rel(t) = X_REL_MEAN - V_REL*t
    ts   = np.linspace(0, T_CPA_TRUE * 1.35, 150)
    traj = np.array([X_REL_MEAN - V_REL * t for t in ts])
    ax.plot(traj[:,0], traj[:,1], "--", color=C3, lw=1.4, alpha=0.6)
    # True dCPA
    ax.scatter(*DCPA_TRUE, color=C3, s=100, marker="x", zorder=6, linewidths=2.2,
               label=f"dCPA = ({DCPA_TRUE[0]:.1f}, {DCPA_TRUE[1]:.1f}) NM")
    ax.set_xlim(*GEO_XLIM)
    ax.set_ylim(*GEO_YLIM)
    ax.set_xlabel("x (NM)", fontsize=10)
    ax.set_ylabel("y (NM)", fontsize=10)
    ax.set_title("Conflict geometry", fontsize=11, fontweight="bold")
    ax.legend(fontsize=9)
    ax.set_aspect("equal")
    ax.grid(True, alpha=0.25)

    # ── (0,1) Relative position samples ──────────────────────────────────────
    ax = axes[0, 1]
    if xs is not None:
        ax.scatter(xs[:,0], xs[:,1], color=C4, s=28, alpha=0.65, zorder=3,
                   label=f"Samples (n={n})")
        th = np.linspace(0, 2*np.pi, 200)
        ax.plot(X_REL_MEAN[0] + SIGMA * np.cos(th),
                X_REL_MEAN[1] + SIGMA * np.sin(th),
                "--", color=C2, lw=1.1, alpha=0.55, label="1-\u03c3 bound")
    ax.scatter(*X_REL_MEAN, color=C2, s=120, marker="*", zorder=6,
               label="Mean x_rel")
    ax.set_xlim(*XREL_XLIM)
    ax.set_ylim(*XREL_YLIM)
    ax.set_xlabel("x_rel,x (NM)", fontsize=10)
    ax.set_ylabel("x_rel,y (NM)", fontsize=10)
    ax.set_title("Relative position samples", fontsize=11, fontweight="bold")
    ax.legend(fontsize=9)
    ax.set_aspect("equal")
    ax.grid(True, alpha=0.25)

    # ── (1,0) dCPA vector samples ─────────────────────────────────────────────
    ax = axes[1, 0]
    if ds is not None:
        ax.scatter(ds[:,0], ds[:,1], color=C4, s=28, alpha=0.65, zorder=3,
                   label="d_CPA samples")
    ax.scatter(*DCPA_TRUE, color=C3, s=120, marker="*", zorder=6,
               label=f"True d_CPA ({DCPA_TRUE[0]:.1f}, {DCPA_TRUE[1]:.1f}) NM")
    ax.axhline(0, color="gray", lw=0.6, alpha=0.4)
    ax.axvline(0, color="gray", lw=0.6, alpha=0.4)
    ax.set_xlim(*DCPA_XLIM)
    ax.set_ylim(*DCPA_YLIM)
    ax.set_xlabel("d_CPA,x (NM)", fontsize=10)
    ax.set_ylabel("d_CPA,y (NM)", fontsize=10)
    ax.set_title("d_CPA vector", fontsize=11, fontweight="bold")
    ax.legend(fontsize=9)
    ax.set_aspect("equal")
    ax.grid(True, alpha=0.25)

    # ── (1,1) Histogram of |d_CPA| ───────────────────────────────────────────
    ax = axes[1, 1]
    if ms is not None and len(ms) >= 2:
        ax.hist(ms, bins="auto", color=C4, alpha=0.72, edgecolor="white",
                density=True, label="|d_CPA| samples")
    ax.axvline(DCPA_MAG, color=C3, linestyle="--", lw=2.0,
               label=f"True |d_CPA| = {DCPA_MAG:.2f} NM")
    ax.set_xlim(*HIST_XLIM)
    ax.set_xlabel("|d_CPA| (NM)", fontsize=10)
    ax.set_ylabel("Density", fontsize=10)
    ax.set_title("Distribution of |d_CPA|", fontsize=11, fontweight="bold")
    ax.legend(fontsize=9)
    ax.grid(True, alpha=0.25)

    plt.tight_layout()
    buf = io.BytesIO()
    fig.savefig(buf, format="png", dpi=130, bbox_inches="tight", facecolor="white")
    plt.close(fig)
    buf.seek(0)
    return base64.b64encode(buf.read()).decode()
`);

statusEl.textContent = "Ready";
loadingEl.style.display = "none";
imgEl.style.display = "block";
btn1.disabled = btn10.disabled = btnReset.disabled = false;

async function refresh() {
  imgEl.style.opacity = "0.55";
  try {
    const result = await pyodide.runPythonAsync("render()");
    if (result.startsWith("ERR:")) {
      statusEl.textContent = "Python error — see console";
      console.error("[cd-widget]", result.slice(4));
      const pre = document.getElementById("cd-error");
      pre.textContent = result.slice(4);
      pre.style.display = "block";
    } else {
      document.getElementById("cd-error").style.display = "none";
      imgEl.src = "data:image/png;base64," + result;
      statusEl.textContent = "Ready";
    }
  } catch (e) {
    statusEl.textContent = "JS error: " + e.message;
    console.error("[cd-widget]", e);
  }
  imgEl.style.opacity = "1";
}

async function syncCount() {
  const n = await pyodide.runPythonAsync("len(xrel_samples)");
  countEl.textContent = n === 1 ? "1 sample" : `${n} samples`;
}

await refresh();

btn1.addEventListener("click", async () => {
  btn1.disabled = btn10.disabled = btnReset.disabled = true;
  await pyodide.runPythonAsync("add_samples(10)");
  await syncCount();
  await refresh();
  btn1.disabled = btn10.disabled = btnReset.disabled = false;
});

btn10.addEventListener("click", async () => {
  btn1.disabled = btn10.disabled = btnReset.disabled = true;
  await pyodide.runPythonAsync("add_samples(100)");
  await syncCount();
  await refresh();
  btn1.disabled = btn10.disabled = btnReset.disabled = false;
});

btnReset.addEventListener("click", async () => {
  btn1.disabled = btn10.disabled = btnReset.disabled = true;
  await pyodide.runPythonAsync("reset_samples()");
  await syncCount();
  await refresh();
  btn1.disabled = btn10.disabled = btnReset.disabled = false;
});
</script>
