services:
  blog:
    image: ruby:3.2-slim
    working_dir: /app
    volumes:
      - .:/app
    ports:
      - "4000:4000"
    command: >
      bash -c "apt-get update -qq &&
               apt-get install -y --no-install-recommends build-essential &&
               gem install bundler -v 2.3.25 --quiet &&
               bundle install --quiet &&
               bundle exec jekyll serve --host 0.0.0.0 --livereload --disable-disk-cache"

  lab:
    build: .
    ports:
      - "8000:8000"
