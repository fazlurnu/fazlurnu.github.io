name: Deploy Jekyll + JupyterLite

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Build Jekyll using the same environment GitHub Pages uses
      - name: Build Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      # Build JupyterLite and drop it into _site/lab/
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install JupyterLite
        run: pip install jupyterlite-core jupyterlite-pyodide-kernel

      - name: Build JupyterLite
        run: jupyter lite build --contents notebooks/ --output-dir _site/lab

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
